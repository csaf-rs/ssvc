[package]
name = "ssvc"
edition = "2024"
rust-version = "1.85.0"
version = "0.5.0"
publish = true
description = "Implementation of the SSVC specification in Rust"
license = "Apache-2.0"
repository = "https://github.com/csaf-rs/ssvc"
exclude = ["/ssvc", "/assets/namespaces.py", "/.github"]

[lints.rust]
unsafe_code = "forbid"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:tsify", "dep:console_error_panic_hook"]

[dependencies]
regress = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
thiserror = "2"
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
jiff = { version = "1.0.2", features = ["js", "serde"] }

[build-dependencies]
anyhow = "1"
serde_json = "1"
typify = "0.10.1"
prettyplease = "0.3"
syn = "3"
jsonschema = { version = "0.62", default-features = false }
schemars = "0.8.22"

[dev-dependencies]
wasm-bindgen-test = "0.3"
rstest = "0.28"
